<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Codex 远程</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <div id="scrim" hidden></div>
    <aside id="sidebar">
      <div class="sidebar-head">
        <span class="brand">Codex 远程</span>
        <button id="closeSidebar" class="icon-btn" title="关闭会话列表" aria-label="关闭会话列表">×</button>
      </div>
      <button id="newSessionBtn" class="new-btn" type="button">+ 新会话</button>
      <div class="sidebar-tools">
        <label class="sr-only" for="sessionSearch">搜索会话</label>
        <input id="sessionSearch" type="search" autocomplete="off" placeholder="搜索会话或项目…">
        <span id="sessionCount" class="session-count"></span>
      </div>
      <ul id="sessionList"></ul>
    </aside>

    <main>
      <header>
        <button id="menuBtn" class="icon-btn" type="button" title="打开会话列表" aria-label="打开会话列表">☰</button>
        <div class="title-wrap">
          <div id="chatTitle">选择或新建一个会话</div>
          <div id="chatSub"></div>
        </div>
        <div id="connectionPill" class="connection-pill connecting" role="status" aria-live="polite">连接中</div>
        <div id="statusPill" class="pill idle">空闲</div>
        <button id="backgroundBtn" class="ghost-btn background-btn" type="button" hidden>后台服务</button>
        <button id="copySessionIdBtn" class="ghost-btn copy-session-btn" type="button" title="复制会话 ID" aria-label="复制会话 ID" hidden>复制ID</button>
        <button id="stopBtn" class="danger-btn" type="button" hidden>停止</button>
      </header>

      <section id="backgroundPanel" class="background-panel" hidden>
        <div class="background-head">
          <div><span class="background-title">后台终端</span><span id="backgroundCount" class="background-count">0</span></div>
          <button id="cleanBackgroundBtn" class="ghost-btn" type="button">清理已结束</button>
        </div>
        <div id="backgroundList" class="background-list"></div>
      </section>

      <section id="chatScroll" aria-label="会话记录">
        <div id="chat" role="log" aria-live="polite" aria-relevant="additions text"></div>
        <button id="jumpLatest" class="jump-latest" type="button" hidden>↓ 最新</button>
      </section>

      <section id="newPanel" hidden>
        <div class="panel-inner">
          <h2>新建会话</h2>
          <label>项目目录</label>
          <select id="projectSelect"></select>
          <label>初始指令</label>
          <textarea id="newPrompt" rows="4" placeholder="告诉 Codex 要做什么…"></textarea>
          <div class="panel-actions">
            <button id="cancelNew" class="ghost-btn" type="button">取消</button>
            <button id="createSession" class="primary-btn" type="button" disabled>开始</button>
          </div>
        </div>
      </section>

      <footer id="composer">
        <textarea id="promptInput" rows="1" placeholder="输入消息，Enter 发送 · Shift+Enter 换行" aria-label="输入消息" disabled></textarea>
        <button id="sendBtn" class="primary-btn" type="button" disabled>发送</button>
      </footer>
    </main>
  </div>

  <div id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
